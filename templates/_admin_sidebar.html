<aside class="admin-sidebar">
  <a class="admin-sidebar-brand" href="/admin">
    <span class="admin-brand-mark">
      <img src="/assets/sprites/happy_toonzz_icon.png" alt="" />
    </span>
    <span class="admin-brand-copy">
      <strong>Happy Toonzz</strong>
      <small>CREATOR WORKSPACE</small>
    </span>
  </a>

  <nav class="admin-sidebar-nav" aria-label="Admin navigation">
    <div class="admin-nav-group">
      <span class="admin-nav-label">WORKSPACE</span>
      <a class="admin-nav-link {{ 'active' if active_admin_page == 'overview' else '' }}" href="/admin">
        <span class="admin-nav-icon" aria-hidden="true">⌂</span>Overview
      </a>
      <a class="admin-nav-link {{ 'active' if active_admin_page == 'assistant' else '' }}" href="/admin/assistant">
        <span class="admin-nav-icon" aria-hidden="true">✦</span>AI Engine
        <span class="admin-nav-indicator" aria-hidden="true"></span>
      </a>
    </div>

    <div class="admin-nav-group">
      <span class="admin-nav-label">MANAGE</span>
      <a class="admin-nav-link {{ 'active' if active_admin_page == 'channel' else '' }}" href="/admin/channel">
        <span class="admin-nav-icon" aria-hidden="true">◈</span>Channel profile
      </a>
      <a class="admin-nav-link {{ 'active' if active_admin_page == 'looks' else '' }}" href="/admin/looks">
        <span class="admin-nav-icon" aria-hidden="true">◇</span>Character looks
      </a>
      <a class="admin-nav-link {{ 'active' if active_admin_page == 'inbox' else '' }}" href="/admin/inbox">
        <span class="admin-nav-icon" aria-hidden="true">◉</span>Fan inbox
      </a>
      <a class="admin-nav-link {{ 'active' if active_admin_page == 'settings' else '' }}" href="/admin/settings">
        <span class="admin-nav-icon" aria-hidden="true">⚙</span>Settings
      </a>
    </div>
  </nav>

  <div class="admin-sidebar-footer">
    <div class="admin-engine-status {{ 'is-ready' if has_api_key else 'is-pending' }}">
      <span class="admin-status-dot"></span>
      <span>
        <small>AI ENGINE</small>
        <strong>{{ 'Key configured' if has_api_key else 'Setup required' }}</strong>
      </span>
      <a href="/admin/settings#api-settings" aria-label="Configure AI engine">↗</a>
    </div>
    <div class="admin-sidebar-user">
      <span class="admin-user-avatar">{{ user.username[:1]|upper }}</span>
      <span class="admin-user-copy"><strong>{{ user.username }}</strong><small>Administrator</small></span>
      <form action="/logout" method="post">
        <button class="admin-logout-button" type="submit" aria-label="Log out">↗</button>
      </form>
    </div>
  </div>
</aside>
